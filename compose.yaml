services:
  web:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "8088:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./data:/var/lib/fitness
    restart: unless-stopped

x-casaos:
  main: web
  scheme: http
  port_map: '8088'
  index: /
  icon: https://raw.githubusercontent.com/marlima10/aurora-lab/main/site/favicon.svg
  title:
    en_US: AuroraLAB
    pt_BR: AuroraLAB
