services:
  actual:
    image: ghcr.io/actualbudget/actual:26.10.0@sha256:24645e971da6bb1a1f953d6859e307a0b29be1e8b4130a35b3220c209b5b860c
    user: '1000:1000'
    environment:
      TZ: America/Sao_Paulo
      ACTUAL_PORT: '5006'
      ACTUAL_DATA_DIR: /data
      ACTUAL_LOGIN_METHOD: password
      ACTUAL_ALLOWED_LOGIN_METHODS: password
    ports: ['127.0.0.1:5006:5006']
    volumes: ['./data/actual:/data']
    networks: [actual]
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  monitor:
    environment: {ACTUAL_ENABLED: '1'}
  backup:
    volumes:
      - ./data/actual:/source/actual:ro
      - ./compose.actual.yaml:/source/config/compose.actual.yaml:ro
networks:
  actual:
