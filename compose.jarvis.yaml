# Optional AuroraLAB module. Insert BEFORE compose.auth.yaml in COMPOSE_FILE.
x-jarvis-base: &base
  build: {context: ./docker/server/jarvis, target: base}
  image: auroralab-jarvis-base:30.0.0
  user: '65534:65534'
  read_only: true
  tmpfs: ['/tmp:size=96m,mode=1777']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  mem_limit: 192m
  cpus: 0.5
  pids_limit: 64
  networks: [jarvis]
  environment: {TZ: America/Sao_Paulo}
  logging: {driver: json-file, options: {max-size: 5m, max-file: '3'}}
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  jarvis-web:
    build: {context: ./docker/server/jarvis, dockerfile: Dockerfile.web}
    image: auroralab-jarvis-web:30.0.0
    networks: [jarvis]
    read_only: true
    tmpfs: ['/tmp:size=24m', '/var/cache/nginx:size=16m', '/run:size=1m']
    mem_limit: 64m
    pids_limit: 32
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 5m, max-file: '3'}}
    healthcheck: {test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health'], interval: 30s, timeout: 5s, retries: 3}
  jarvis-api:
    <<: *base
    command: [python, api.py]
    environment: {JARVIS_MODEL: '${JARVIS_MODEL:-aurora-jarvis:1.7b}'}
    volumes: ['./data/jarvis/app:/data', './secrets/jarvis/api.json:/run/secrets/config.json:ro']
    networks: [jarvis, auth]
    mem_limit: 256m
    cpus: 1
  jarvis-engine:
    <<: *base
    image: auroralab-openjarvis-engine:30.0.0
    build: {context: ./docker/server/jarvis, target: engine}
    environment: {JARVIS_MODEL: '${JARVIS_MODEL:-aurora-jarvis:1.7b}', JARVIS_NUM_CTX: '8192'}
    volumes: ['./secrets/jarvis/engine.json:/run/secrets/config.json:ro']
    networks: [jarvis, jarvis-model]
    mem_limit: 384m
  jarvis-ollama:
    image: ollama/ollama:0.30.10@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee
    user: '65534:65534'
    environment: {HOME: /models, OLLAMA_MODELS: /models/models, OLLAMA_HOST: '0.0.0.0:11434', OLLAMA_NO_CLOUD: '1', OLLAMA_NUM_PARALLEL: '1', OLLAMA_MAX_LOADED_MODELS: '1', OLLAMA_KEEP_ALIVE: 2m, OLLAMA_CONTEXT_LENGTH: '8192'}
    volumes: ['./data/jarvis/ollama:/models', './docker/server/jarvis/Modelfile:/etc/aurora/Modelfile:ro']
    networks: [jarvis-model, jarvis-download]
    read_only: true
    tmpfs: ['/tmp:size=128m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4608m
    cpus: 2
    pids_limit: 160
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 5m, max-file: '3'}}
    healthcheck: {test: [CMD, ollama, list], interval: 30s, timeout: 5s, retries: 3, start_period: 30s}
  jarvis-whisper:
    <<: *base
    image: auroralab-jarvis-whisper:30.0.0
    build: {context: ./docker/server/jarvis, target: whisper}
    environment: {SPEECH_ROLE: transcribe, OMP_NUM_THREADS: '2', HF_HUB_OFFLINE: '1'}
    volumes: ['./data/jarvis/models:/models:ro', './secrets/jarvis/whisper.json:/run/secrets/config.json:ro']
    mem_limit: 1024m
    cpus: 2
    pids_limit: 96
  jarvis-piper:
    <<: *base
    image: auroralab-jarvis-piper:30.0.0
    build: {context: ./docker/server/jarvis, target: piper}
    environment: {SPEECH_ROLE: synthesize, OMP_NUM_THREADS: '1'}
    volumes: ['./data/jarvis/models:/models:ro', './secrets/jarvis/piper.json:/run/secrets/config.json:ro']
    mem_limit: 384m
    cpus: 1
  jarvis-worker:
    <<: *base
    command: [python, worker.py]
    volumes: ['./data/jarvis/app:/data']
    networks: [jarvis]
    healthcheck: {disable: true}
    mem_limit: 64m
    cpus: 0.25
  jarvis-fitness:
    <<: *base
    command: [python, connector.py]
    environment: {CONNECTOR_ROLE: fitness}
    volumes: ['./secrets/jarvis/fitness.json:/run/secrets/config.json:ro']
    networks: [jarvis, opengym]
  jarvis-food:
    <<: *base
    command: [python, connector.py]
    environment: {CONNECTOR_ROLE: food}
    volumes: ['./secrets/jarvis/food.json:/run/secrets/config.json:ro']
    networks: [jarvis, mealie]
  jarvis-print:
    <<: *base
    command: [python, connector.py]
    environment: {CONNECTOR_ROLE: print}
    volumes: ['./secrets/jarvis/print.json:/run/secrets/config.json:ro']
    networks: [jarvis, manyfold, default]
  jarvis-finance:
    <<: *base
    image: auroralab-jarvis-finance:30.0.0
    build: {context: ./docker/server/jarvis, dockerfile: Dockerfile.finance}
    command: [node, finance.mjs]
    volumes: ['./data/jarvis/finance:/data', './secrets/jarvis/finance.json:/run/secrets/config.json:ro']
    networks: [jarvis, actual]
    mem_limit: 512m
    cpus: 1
    pids_limit: 96
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  jarvis-research:
    <<: *base
    image: auroralab-jarvis-research:30.0.0
    build: {context: ./docker/server/jarvis, target: research}
    environment: {CONNECTOR_ROLE: research}
    volumes: ['./secrets/jarvis/research.json:/run/secrets/config.json:ro']
    networks: [jarvis, jarvis-search]
    mem_limit: 256m
  jarvis-models-init:
    <<: *base
    profiles: [jarvis-setup]
    image: auroralab-jarvis-whisper:30.0.0
    build: {context: ./docker/server/jarvis, target: whisper}
    command: [python, prepare_models.py]
    volumes: ['./data/jarvis/models:/models']
    networks: [jarvis-download]
    restart: 'no'
    healthcheck: {disable: true}
    mem_limit: 512m
  auth-gateway:
    networks: [auth, default, manyfold, mealie, actual, opengym, jarvis]
  backup:
    networks: [default, manyfold]
    environment: {MANYFOLD_BACKUP_WARMUP: '1'}
    volumes:
      - ./data/jarvis/app:/source/jarvis-app:ro
      - ./compose.jarvis.yaml:/source/config/compose.jarvis.yaml:ro
networks:
  jarvis: {internal: true}
  jarvis-model: {internal: true}
  jarvis-download: {}
  jarvis-search: {}
