<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/aurora.css"><title>Aurora Lab · Rede</title><link rel="stylesheet" href="/aurora-layout.css?v=20261007-1"></head><body><div class="wrap"><div class="top"><div><div class="brand">🌐 AURORA LAB · REDE</div><div class="muted" id="stamp"></div></div><a class="btn" href="/">← Dashboard</a></div><div class="grid"><div class="card">Conhecidos<div class="big" id="total">--</div></div><div class="card">Online<div class="big green" id="online">--</div></div><div class="card">Offline<div class="big red" id="offline">--</div></div></div><div class="card"><input id="q" placeholder="Filtrar IP, MAC ou nome" style="padding:10px;width:320px" oninput="render()"><table><thead><tr><th>Estado</th><th>IP</th><th>MAC</th><th>Nome</th><th>Última detecção</th></tr></thead><tbody id="body"></tbody></table></div></div><script src="/aurora.js"></script><script>let D={devices:[]};function render(){let s=q.value.toLowerCase();body.innerHTML=(D.devices||[]).filter(x=>JSON.stringify(x).toLowerCase().includes(s)).map(x=>`<tr><td class="${x.online?'green':'red'}">${x.online?'● Online':'● Offline'}</td><td>${esc(x.ip)}</td><td>${esc(x.mac)}</td><td>${esc(x.name||'—')}</td><td>${esc(x.last_seen||'—')}</td></tr>`).join('')}async function load(){try{D=await json('/api/network.json');total.textContent=D.total;online.textContent=D.online;offline.textContent=D.offline;stamp.textContent=D.subnet+' · '+D.generated;render()}catch(e){console.error(e)}}load();setInterval(load,120000)</script><script src="/aurora-layout.js?v=20261017-v4" defer></script></body></html>
