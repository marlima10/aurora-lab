global
    maxconn 4096
    user haproxy
    group haproxy
    daemon
    log 127.0.0.1 local0 debug
defaults
    log global
    mode http
    option httplog
    option dontlognull
    retries 3
    option redispatch
    option http-server-close
    option forwardfor
    timeout connect 5s
    timeout client 15m
    timeout server 15m
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
frontend public
    bind *:80 alpn h2,http/1.1
    use_backend webcam if { path_beg /webcam/ }
    default_backend octoprint
backend octoprint
    server octoprint1 127.0.0.1:5000
backend webcam
    http-request replace-path /webcam/(.*) /\1
    server webcam1 camera:8080 resolvers docker init-addr none
