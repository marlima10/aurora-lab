upstream aurora_monitor { server monitor:9101; }
# Limite por IP apenas para POST: chave vazia não é contada pelo limit_req.
map $request_method $aurora_post_key { default ""; POST $binary_remote_addr; }
limit_req_zone $aurora_post_key zone=aurora_power_post:1m rate=6r/m;
limit_req_zone $aurora_post_key zone=aurora_api_post:2m rate=120r/m;
server {
    listen 80;
    server_name _;
    server_tokens off;
    limit_req_status 429;
    resolver 127.0.0.11 valid=10s;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    include /etc/nginx/aurora-security-headers.conf;
    location ~ ^/(octoprint|cockpit|homeassistant|manyfold|mealie|actual)$ {
        proxy_pass http://aurora_monitor;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/aurora-security-headers.conf;
    }
    location = /homeboard {
        proxy_pass http://aurora_monitor/homeboard;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/aurora-security-headers.conf;
    }
    location = /garmin {
        proxy_pass http://aurora_monitor/garmin;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/aurora-security-headers.conf;
    }
    location = /opengym {
        proxy_pass http://aurora_monitor/opengym;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/aurora-security-headers.conf;
    }
    location = /opengym.html {
        proxy_pass http://aurora_monitor/opengym;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/aurora-security-headers.conf;
    }
    location = /fitness-api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_pass php:9000;
        limit_req zone=aurora_api_post burst=40 nodelay;
        error_page 429 @aurora_rate_limited;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/aurora-security-headers.conf;
    }
    location ~ ^/(?:api/)?(status|history|network|diagnostics|alerts|restore-check)\.json$ {
        proxy_pass http://aurora_monitor;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/aurora-security-headers.conf;
    }
    location = /api/fitness-backup.json {
        proxy_pass http://aurora_monitor;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/aurora-security-headers.conf;
    }
    location ^~ /api/power {
        proxy_pass http://aurora_monitor;
        client_max_body_size 1k;
        proxy_read_timeout 15s;
        limit_req zone=aurora_power_post burst=5 nodelay;
        error_page 429 @aurora_rate_limited;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/aurora-security-headers.conf;
    }
    location = /camera-stream {
        set $camera http://camera:8080;
        proxy_pass $camera/stream;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/aurora-security-headers.conf;
    }
    location @aurora_rate_limited {
        default_type application/json;
        add_header Retry-After "60" always;
        include /etc/nginx/aurora-security-headers.conf;
        return 429 '{"ok":false,"error":"Muitas tentativas em pouco tempo. Aguarde um minuto e tente de novo."}';
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
