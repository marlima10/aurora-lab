upstream aurora_monitor { server monitor:9101; }
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    location = /fitness-api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_pass php:9000;
        add_header Cache-Control "no-store" always;
    }
    location ~ ^/(?:api/)?(status|history|network|diagnostics)\.json$ {
        proxy_pass http://aurora_monitor;
        add_header Cache-Control "no-store" always;
    }
    location = /api/fitness-backup.json {
        proxy_pass http://aurora_monitor;
        add_header Cache-Control "no-store" always;
    }
    location = /camera-stream {
        set $camera http://camera:8080;
        proxy_pass $camera/stream;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
