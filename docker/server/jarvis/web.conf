server {
    listen 8080;
    server_tokens off;
    client_max_body_size 12m;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location /jarvis/api/ {
        set $api http://jarvis-api:8000;
        proxy_pass $api$request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Aurora-CSRF $http_x_aurora_csrf;
        proxy_set_header Authorization "";
        proxy_read_timeout 180s;
    }
    location = /health { return 200 'ok'; }
    location = /jarvis { return 308 /jarvis/; }
    location /jarvis/ { root /usr/share/nginx/html; index index.html; try_files $uri $uri/ =404; }
    location / { return 404; }
}
