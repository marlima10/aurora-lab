map $http_upgrade $cockpit_connection {
    default upgrade;
    '' close;
}
server {
    listen 9090 ssl;
    ssl_certificate /run/secrets/cockpit-tls.crt;
    ssl_certificate_key /run/secrets/cockpit-tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 =301 https://$host:9090$request_uri;
    location / {
        proxy_pass https://host.docker.internal:9091;
        proxy_ssl_server_name on;
        proxy_ssl_name auroraserver;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 1;
        proxy_ssl_trusted_certificate /run/secrets/cockpit-tls.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cockpit_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
