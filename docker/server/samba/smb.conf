[global]
  workgroup = WORKGROUP
  server role = standalone server
  security = user
  map to guest = Never
  server min protocol = SMB2
  smb ports = 445
  log file = /dev/stdout
  logging = stdout
  load printers = no
  disable spoolss = yes
  printcap name = /dev/null
[Prints]
  path = /shares/prints
  browseable = yes
  read only = no
  guest ok = no
  valid users = rafael
  force user = rafael
  create mask = 0660
  directory mask = 0770
