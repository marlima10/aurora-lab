server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;

    location = /fitness-api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 30s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Este pacote roda sem o RK. Os recursos do servidor antigo permanecem indisponíveis.
    location = /status.json { default_type application/json; return 503 '{"available":false,"message":"Monitoramento do RK não incluído neste pacote."}'; }
    location = /history.json { default_type application/json; return 503 '{"available":false,"message":"Histórico do RK não incluído neste pacote."}'; }
    location = /network.json { default_type application/json; return 503 '{"available":false,"message":"Dados de rede do RK não incluídos neste pacote."}'; }
    location = /diagnostics.json { default_type application/json; return 503 '{"available":false,"message":"Diagnósticos do RK não incluídos neste pacote."}'; }
    location /api/ { default_type application/json; return 503 '{"available":false,"message":"API do RK não incluída neste pacote."}'; }
    location = /camera-stream { default_type application/json; return 503 '{"available":false,"message":"Câmera do RK não incluída neste pacote."}'; }

    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
