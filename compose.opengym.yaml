services:
  opengym-api:
    image: ghcr.io/duartesantos8/opengym-api:1.4.1@sha256:4bc07fe7d1f05a57c0fa25da3563d54dfe27223506637d67fc64088a2a2f140b
    env_file: ./secrets/opengym.env
    environment:
      PORT: '3000'
      DATA_DIR: /data
      TRUST_PROXY: '1'
      FIRST_USER_ADMIN: '1'
      ALLOW_GUEST: '0'
      DEFAULT_LANG: pt-BR
      COACH_DISABLED: '1'
    volumes: ['./data/opengym:/data']
    networks: [opengym]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  opengym-web:
    image: ghcr.io/duartesantos8/opengym-web:1.4.1@sha256:e32cae9d2f4aad0c5e1b7888c9bfc712b2306ddfe3c65bc4cfefd4b0002e86d3
    ports: ['127.0.0.1:8081:80']
    environment:
      NGINX_PORT: '80'
      BACKEND: opengym-api
      PORT: '3000'
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ''
      BASE_PATH: ''
      MEDIA_UPLOAD_MAX: 48m
    networks: [opengym]
    depends_on: [opengym-api]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  opengym:
