services:
  opengym-api:
    image: ghcr.io/duartesantos8/opengym-api:1.4.1@sha256:4bc07fe7d1f05a57c0fa25da3563d54dfe27223506637d67fc64088a2a2f140b
    env_file: ./secrets/opengym.env
    environment:
      PORT: '3000'
      DATA_DIR: /data
      TRUST_PROXY: '1'
      FIRST_USER_ADMIN: '1'
      ALLOW_GUEST: '0'
      DEFAULT_LANG: pt-BR
      COACH_DISABLED: '1'
    volumes: ['./data/opengym:/data']
    networks: [opengym]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  opengym-web:
    image: auroralab-opengym-web:20.0.0
    build: ./docker/server/opengym
    ports: ['127.0.0.1:8081:80']
    environment:
      NGINX_PORT: '80'
      BACKEND: opengym-api
      PORT: '3000'
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ''
      BASE_PATH: ''
      MEDIA_UPLOAD_MAX: 48m
    volumes:
      - ./docker/server/garmin/opengym-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks: [opengym]
    depends_on: [opengym-api]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  opengym-garmin:
    build: ./docker/server/garmin
    environment:
      PUBLIC_ORIGIN: ${OPENGYM_ORIGIN:?configure OPENGYM_ORIGIN}
      DATA_DIR: /data
    volumes: ['./data/garmin:/data']
    networks: [opengym]
    read_only: true
    user: '65534:65534'
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 384m
    pids_limit: 128
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  opengym:
